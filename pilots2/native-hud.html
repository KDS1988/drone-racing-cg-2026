<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пилоты Будущего 2 · прозрачный HUD</title><style>
:root{color-scheme:normal}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent!important}#stage{width:1920px;height:1080px;position:absolute;left:0;top:0;transform-origin:top left;background:transparent!important;color:#fff;font-family:Arial,sans-serif}#panel{position:absolute;left:90px;top:100px;width:1180px;max-height:870px;overflow:hidden;background:rgba(22,8,65,.93);border-left:12px solid #01d7fb;box-shadow:0 12px 45px #0008;padding:32px 40px}#panel.side{left:0;top:90px;width:480px;height:900px;padding:24px 18px;border-left:8px solid #01d7fb}h1{font-size:40px;margin:0 0 24px;color:#01d7fb;text-transform:uppercase}#panel.side h1{font-size:24px}table{border-collapse:collapse;width:100%;table-layout:fixed}td,th{padding:14px 10px;border-bottom:1px solid #ffffff3b;text-align:left;font-size:28px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}th{font-size:19px;color:#01d7fb;text-transform:uppercase}td:first-child,th:first-child{width:72px}#panel.side td{font-size:18px;padding:14px 5px}#panel.side th{font-size:13px;padding:8px 4px}#panel.side td:first-child,#panel.side th:first-child{width:38px}.lead{color:#01d7fb;font-weight:900}.sub{color:#d1c8ff;font-size:20px;margin-top:16px}#panel.side .sub{font-size:15px}.empty{display:none}
</style></head><body><div id="stage"><section id="panel" class="empty"><h1 id="title"></h1><table><thead id="head"></thead><tbody id="rows"></tbody></table><div class="sub" id="status"></div></section></div><script>
(function(){'use strict';const q=new URLSearchParams(location.search),type=q.get('type')||'all',names={all:'Общий прогресс',sim:'Технический симулятор',basket:'Дрон-баскетбол',race:'Гонка 75 мм',results:'Итоговые результаты',side:'Ход гонки'},stages=['Симулятор','Баскетбол','75 мм'];const panel=document.getElementById('panel');if(type==='side')panel.classList.add('side');const el=id=>document.getElementById(id);el('title').textContent=names[type]||names.all;let busy=false;
function resize(){el('stage').style.transform='scale('+Math.min(innerWidth/1920,innerHeight/1080)+')'}addEventListener('resize',resize);resize();
function ms(v){if(v==null||!Number.isFinite(Number(v)))return '—';v=Math.max(0,Number(v));return Math.floor(v/60000)+':'+String(Math.floor(v%60000/1000)).padStart(2,'0')+'.'+String(Math.floor(v%1000)).padStart(3,'0')}
function td(tr,value,lead){const c=document.createElement('td');c.textContent=value==null?'—':String(value);if(lead)c.className='lead';tr.appendChild(c)}
function draw(d){if(!d||!Array.isArray(d.players))throw Error('JSON: нет players');const byId=new Map(d.players.map(p=>[p.id,p]));let arr=Array.isArray(d.ranking)?d.ranking.map(id=>byId.get(id)).filter(Boolean):[];d.players.forEach(p=>{if(!arr.includes(p))arr.push(p)});const head=el('head'),rows=el('rows');head.replaceChildren();rows.replaceChildren();let labels=['№','Пилот','Результат'];if(type==='all'||type==='results')labels=['№','Пилот','Симулятор','Баскетбол','75 мм','Финиш'];const hr=document.createElement('tr');labels.forEach(x=>{let c=document.createElement('th');c.textContent=x;hr.appendChild(c)});head.appendChild(hr);
arr.slice(0,type==='side'?8:12).forEach((p,i)=>{let tr=document.createElement('tr');td(tr,i+1,i===0);td(tr,p.name||'Участник '+p.id,i===0);if(type==='all'||type==='results'){for(let j=0;j<3;j++)td(tr,((p.counts||[])[j]??0)+'/'+((d.targets||[])[j]??'—'));td(tr,ms(p.finishMs))}else if(type==='side')td(tr,p.finished?'ФИНИШ':stages[p.stage]||'Ожидание');else{let j=type==='sim'?0:type==='basket'?1:2;td(tr,((p.counts||[])[j]??0)+'/'+((d.targets||[])[j]??'—')+' · '+ms((p.durationsMs||[])[j]))}rows.appendChild(tr)});
el('status').textContent=(d.status||'')+' · '+ms(d.elapsedMs)+' · обновлено '+new Date().toLocaleTimeString('ru-RU');panel.classList.remove('empty')}
async function load(){if(busy)return;busy=true;try{let r=await fetch('https://sf.fgdrrace.ru/api',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);draw(await r.json())}catch(e){el('status').textContent='API недоступен: '+e.message;console.error(e)}finally{busy=false}}load();setInterval(load,1000)
})();
</script></body></html>
